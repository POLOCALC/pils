name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      # STOUT (a dependency, git+https from POLOCALC/stout, which pip may spell in lower case) is
      # private: read with the secret STOUT_TOKEN (fine-grained, Contents: read on POLOCALC/stout;
      # PAT_TOKEN only writes the version bumps on pils),
      # for this step only (git's environment configuration: nothing written to disk)
      env:
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.STOUT_TOKEN }}@github.com/.insteadOf
        GIT_CONFIG_VALUE_0: https://github.com/
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]" --no-cache-dir
    
    - name: Lint with ruff
      run: |
        python -m ruff check pils/ tests/
        python -m ruff format --check pils/ tests/
    
    - name: Type check with pyright
      run: |
        pyright pils/
      continue-on-error: true
    
    - name: Run tests with pytest
      run: |
        python -m pytest tests/ -v --cov=pils --cov-report=xml --cov-report=term
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}