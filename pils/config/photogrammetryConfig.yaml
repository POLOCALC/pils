# =============================================================================
# Photogrammetry Pipeline Configuration
# =============================================================================
# This file contains all parameters that cannot be derived from the Flight
# object or the geodetic targets CSV. Everything else (reference_point,
# video_code, date, geodetic_targets, tel_positions, etc.) is parsed at
# runtime from the Flight object and the --csv_file argument.
# =============================================================================


# -----------------------------------------------------------------------------
# Camera intrinsics
# -----------------------------------------------------------------------------
sony_camera:
  # 3x3 intrinsic matrix [[fx, 0, cx], [0, fy, cy], [0, 0, 1]]
  camera_matrix:
    - [2543.02197265625, 0., 1908.13916015625]
    - [ 0., 2541.0712890625, 1072.185791015625]
    - [0.0,    0.0,    1.0]

  # Distortion coefficients [k1, k2, p1, p2, k3]
  distortion_coeffs: [0.03171190991997719, -0.05128732696175575, -0.00039321804069913924, 0.00012248533312231302, 0.04870585724711418]

alvium_camera:
  # 3x3 intrinsic matrix [[fx, 0, cx], [0, fy, cy], [0, 0, 1]]
  camera_matrix:
    - [9079.129569669898, 0., 1957.9697725824976]
    - [0., 9057.738125201759 , 1603.3806948543029]
    - [0.0,    0.0,    1.0]

  # Distortion coefficients [k1, k2, p1, p2, k3]
  distortion_coeffs: [-0.06874197362777763, 0.525453999633465, 0.0, 0.0, 0.0]



# -----------------------------------------------------------------------------
# Pipeline step parameters
# -----------------------------------------------------------------------------
pipeline:

  # Fixed ENU origin [lat, lon, alt] — campaign-level constant geodetic not ellipsoidal to handle drone altitude
  reference_point: [-22.95977493, -67.78669737, 5182.496] # enu system is built concerning this reference taken with the emlid stick
  dji_base_logged: [-22.9597732, -67.7866847, 5173.020] # drone is flying with respect to this reference (DJi rtk base self measured)

  # GPS-antenna-to-camera lever arm [dE, dN, dU] in metres, added to the drone's
  # GPS (antenna) ENU position in DroneData.correlate_drone_photo to approximate
  # the camera's actual position. Measured/expected magnitude ~0.75-0.8m.
  # NOT yet rotated by drone attitude (yaw/pitch/roll) -- treated as an already-ENU
  # offset, exact only if the true body-frame lever arm is purely vertical (camera
  # slung straight down from the antenna) and the drone stays close to level.
  # RTK:yaw/RTK:pitch in this drone's telemetry currently contain unfiltered
  # sentinel/garbage values and there's no roll channel, so a proper per-frame
  # body-to-ENU rotation isn't wired up yet -- revisit once that's cleaned up.
  lever_arm_enu:  [0.0, 0.0, -0.75]


  # --- Step p2: TargetFinder.finderSequential --------------------------------
  finder:
    tg_by_hand: "click_with_tel" # click
    box_height: 25        # Search box half-height in pixels
    box_width: 25        # Search box half-width in pixels
    color_tol: 10         # ΔE color tolerance for target detection
    tracking_method: "optical_flow"  # per-frame tracking: "optical_flow" (default) or "orb" (legacy, ORB + homography)
    orb_nfeatures: 1000              # ORB feature count -- only used when tracking_method: "orb"
    refine_threshold: 0.98         # ΔE-filter match threshold in the per-frame box-search refinement (finder.py's _refine_target_centers) -- higher = stricter/tighter color match required before a center is accepted


  # --- Step p3: AttitudeReconstruction.run_pnp or .run_mcmc ----------------
  pnp:
    ransac: true          # Use RANSAC for outlier rejection in PnP

  mcmc:
    omega_init:    [180, -45, 0]    # Initial guess [roll, pitch, yaw] in degrees
    t_init:      [-1, 10, 500]      # Initial guess [x, y, z] in metres
    sigma_pixel:   1.0              # Observation noise in pixels (likelihood std)
    sigma_omega:   0.01              # Prior std on RPY angles in degrees
    sigma_t:       0.01              # Prior std on translation in metres
    sigma_K:       15.0             # Prior std on intrinsics (fx, fy, cx, cy) in pixels  
    sigma_dist:    0.01             # Percent gaussian noise on distortion coefficients
    n_samples:     1000             # MCMC draws per chain
    n_tune:        1000             # MCMC tuning steps per chain
    batch_size:    24               # Frames per parallel worker batch
    subsample:     2               # Frame subsampling factor e.g. 1 means use every 30th frame for MCMC (to speed up inference)

  # --- Step p4: DroneData.correlate_drone_photo --------------------------------
  drone_correlation:
    trigger: false        # Use hardware trigger signal for synchronization
    payload: false        # Include payload data in correlation
    use_fft: false        # Use FFT-based cross-correlation (vs. direct)

  # --- Step p6: ConcerningTelescope ------------------------------------------
  telescope:
    tel_names:
      - SATp1
      - SATp2
      - SATp3
      - CLASS1
      - CLASS2

  # --- Step p7: PolarizationAngle --------------------------------------------
  polarization: {}        # No extra params currently — extend as needed